services:
  lightrag:
    image: ${LIGHTRAG_IMAGE:?LIGHTRAG_IMAGE is required}
    container_name: ragent-lightrag-kb-${KB_ID:?KB_ID is required}
    hostname: ragent-lightrag-kb-${KB_ID}
    environment:
      HOST: 0.0.0.0
      PORT: 9621
      LIGHTRAG_API_PREFIX: ""
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY}
      WHITELIST_PATHS: /health
      WORKSPACE: kb_${KB_ID}
      POSTGRES_WORKSPACE: kb_${KB_ID}
      NEO4J_WORKSPACE: kb_${KB_ID}
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      LLM_BINDING: openai
      LLM_BINDING_HOST: ${LLM_BINDING_HOST}
      LLM_BINDING_API_KEY: ${LLM_BINDING_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      SUMMARY_LANGUAGE: 简体中文
      EMBEDDING_BINDING: openai
      EMBEDDING_BINDING_HOST: ${EMBEDDING_BINDING_HOST}
      EMBEDDING_BINDING_API_KEY: ${EMBEDDING_BINDING_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIM: ${EMBEDDING_DIM}
      EMBEDDING_SEND_DIM: "true"
      LIGHTRAG_GRAPH_STORAGE: Neo4JStorage
      LIGHTRAG_KV_STORAGE: PGKVStorage
      LIGHTRAG_VECTOR_STORAGE: PGVectorStorage
      LIGHTRAG_DOC_STATUS_STORAGE: PGDocStatusStorage
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DB}
    volumes:
      - lightrag-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:9621/health', headers={'X-API-Key':'$${LIGHTRAG_API_KEY}'}), timeout=3)\" >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 90s
    mem_limit: 1.5g
    restart: unless-stopped
    networks: [ragent-internal]

networks:
  ragent-internal:
    external: true
    name: ragent-prod-internal

volumes:
  lightrag-data:
    name: ragent-prod-lightrag-kb-${KB_ID}
